name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      # Build first: @vitrinka/expo consumes @vitrinka/redact through its
      # build output (main/types point at build/), so typecheck and tests
      # need the workspace built.
      - run: bun run build
      - run: bun run typecheck
      - run: bun run test
