name: Release @vitrinka/expo

# A release is a tag, never a merge: `git tag expo-vX.Y.Z && git push origin expo-vX.Y.Z`.
# The tag version must equal packages/expo/package.json's version.

on:
  push:
    tags: ["expo-v*"]

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tag-reachability guard needs history
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - name: Refuse tags not reachable from main
        run: |
          # A pushed tag can point at ANY commit; the version check alone would
          # let an unreviewed branch publish with NPM_TOKEN in scope. Only
          # commits that went through main's PR flow may publish.
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "Tag ${GITHUB_REF_NAME} points at a commit not reachable from main — refusing to publish" >&2
            exit 1
          fi
      - name: Verify tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#expo-v}"
          PKG_VERSION="$(node -p "require('./packages/expo/package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag $TAG_VERSION != package.json $PKG_VERSION" >&2
            exit 1
          fi
      # Build first — @vitrinka/expo resolves @vitrinka/redact through its
      # build output (main/types point at build/), same order as ci.yml.
      - run: bun run build
      - run: bun run typecheck
      - run: bun run test
      - name: Publish
        working-directory: packages/expo
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
