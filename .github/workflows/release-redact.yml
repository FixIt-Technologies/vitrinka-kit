name: Release @vitrinka/redact

# A release is a tag, never a merge: `git tag redact-vX.Y.Z && git push origin redact-vX.Y.Z`.
# The tag version must equal packages/redact/package.json's version.
# ORDER MATTERS: @vitrinka/expo depends on @vitrinka/redact — publish this
# package BEFORE the first expo-v* tag that ships the dependency.

on:
  push:
    tags: ["redact-v*"]

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - name: Verify tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#redact-v}"
          PKG_VERSION="$(node -p "require('./packages/redact/package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag $TAG_VERSION != package.json $PKG_VERSION" >&2
            exit 1
          fi
      - run: bun run build
      - run: bun run typecheck
      - run: bun run test
      - name: Publish
        working-directory: packages/redact
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
