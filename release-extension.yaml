# pultik ship manifest — `pultik ship -f release-extension.yaml` publishes the
# journey-recorder Chrome extension to apps.fixit.app.
app: vitrinka-recorder
name: Vitrinka Journey Recorder
icon: "⏺"
icon_file: apps/extension/marketplace-icon.png
description: Chrome extension that records manual-testing journeys — screenshots, clicks, API calls, notes — into vitrinka boards.
platform: chrome
channel: stable
build: ./apps/extension/dist.sh
artifact: dist/vitrinka-recorder-*.zip
version_cmd: node -p "require('./apps/extension/manifest.json').version"
notes_paths: [apps/extension]
